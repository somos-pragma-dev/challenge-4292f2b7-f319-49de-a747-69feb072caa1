[project]
name = "transaction-consolidation-pipeline"
version = "1.0.0"
description = "ETL pipeline para consolidación diaria de transacciones en modelo analítico"
requires-python = ">=3.13"
authors = [
    {name = "Data Engineering Team", email = "data-eng@empresa.com"}
]
keywords = ["etl", "pyspark", "airflow", "delta-lake", "data-quality"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-cov>=4.1.0",
    "black>=24.2.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]
test = [
    "pytest>=8.1.1",
    "pandas>=2.2.2",
    "pyarrow>=14.0.2",
]

[project.urls]
Homepage = "https://github.com/empresa/transaction-consolidation"
Documentation = "https://docs.empresa.com/transaction-consolidation"
Repository = "https://github.com/empresa/transaction-consolidation"

[project.scripts]
consolidate-transactions = "src.main:main"
validate-transactions = "src.utils.validator:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
package-dir = {"" = "."}

[tool.setuptools.package-data]
src = ["schemas/*.json", "**/*.yaml"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --cov=src --cov-report=term-missing:skip-covered"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "quality: Data quality tests",
    "slow: Tests that take more than 10 seconds",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "**/__pycache__/*",
    "**/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 100
target-version = ["py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py313"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[tool.pyspark]
spark_version = "3.5.0"

[tool.delta]
engine = "rust"

[tool.airflow]
version = "2.9.0"
dag_folder = "dags"

[[tool.hatch.metadata.overrides]]
dependencies = [
    "pyspark==3.5.0",
    "apache-airflow==2.9.0",
    "delta-rs==0.17.0",
    "pyyaml==6.0.1",
    "pandas==2.2.2",
    "pyarrow==14.0.2",
]

[dependency-groups]
main = [
    "pyspark>=3.5.0",
    "apache-airflow>=2.9.0",
    "delta-rs>=0.17.0",
    "pyyaml>=6.0.1",
    "pandas>=2.2.2",
    "pyarrow>=14.0.2",
]
test = [
    "pytest>=8.1.1",
    "pytest-cov>=4.1.0",
]